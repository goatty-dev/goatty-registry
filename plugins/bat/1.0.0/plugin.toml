schema = 1
id = "bat"
name = "bat"
version = "1.0.0"
summary = "cat with wings: syntax highlighting, line numbers and git changes"
description = """
bat shows files like cat, but with syntax highlighting for hundreds of languages, \
line numbers, and markers for lines you changed in git. Long files open in a pager. \
When its output goes to another command it prints the plain file, so it's safe in scripts.
"""
publisher = "goatty"
homepage = "https://github.com/sharkdp/bat"
license = "MIT OR Apache-2.0"
keywords = ["cat", "syntax", "highlighting", "pager", "less", "man"]

[compat]
goatty = ">=0.0.1"
os = ["linux"]

[[package]]
id = "bat"
version = "0.26.1"
bin = ["bat"]

[[package.asset]]
target = "x86_64-linux"
url = "https://github.com/sharkdp/bat/releases/download/v0.26.1/bat-v0.26.1-x86_64-unknown-linux-musl.tar.gz"
sha256 = "0dcd8ac79732c0d5b136f11f4ee00e581440e16a44eab5b3105b611bbf2cf191"
size = 3584928
root = "bat-v0.26.1-x86_64-unknown-linux-musl"

[[package.asset]]
target = "aarch64-linux"
url = "https://github.com/sharkdp/bat/releases/download/v0.26.1/bat-v0.26.1-aarch64-unknown-linux-musl.tar.gz"
sha256 = "6369242c584065f195fb20cb36fbd7cb63ae690605bbe89868a7596b596c2c23"
size = 3383478
root = "bat-v0.26.1-aarch64-unknown-linux-musl"

# --- Settings (written to bat's config file, see [[file]] below) -------------

[[setting]]
id = "theme"
label = "Color theme"
help = "The colors for highlighted code."
type = "choice"
default = "ansi"
arg = "--theme=\"{value}\""
group = "Look"
choices = [
  { value = "ansi", label = "Your goatty theme", help = "Uses the terminal's 16 colors, so code matches the theme you picked in goatty." },
  { value = "auto", label = "Automatic", help = "bat's own dark or light theme, picked from the terminal's background." },
  { value = "Monokai Extended", label = "Monokai" },
  { value = "Dracula", label = "Dracula" },
  { value = "Nord", label = "Nord" },
  { value = "gruvbox-dark", label = "Gruvbox dark" },
  { value = "GitHub", label = "GitHub (light)" },
]

[[setting]]
id = "style"
label = "Decorations"
help = "What bat shows around the file's contents."
type = "choice"
default = "default"
arg = "--style={value}"
group = "Look"
choices = [
  { value = "default", label = "Default", help = "File name, line numbers, git changes and a grid." },
  { value = "full", label = "Everything", help = "Also the file size and a header grid." },
  { value = "numbers", label = "Line numbers", arg = "--style=numbers,changes", help = "Only line numbers and git change markers." },
  { value = "plain", label = "Plain", help = "Just the highlighted text, like cat." },
]

[[setting]]
id = "italic"
label = "Italic text"
help = "Use italics where the theme asks for them (comments, mostly). Turn off if your font has no italics."
type = "bool"
default = true
arg = "--italic-text=always"
group = "Look"

[[setting]]
id = "paging"
label = "Pager"
help = "Open long files in a pager (less) so you can scroll and search."
type = "choice"
default = "auto"
arg = "--paging={value}"
group = "Behavior"
choices = [
  { value = "auto", label = "When needed", help = "Only when the file doesn't fit on the screen." },
  { value = "always", label = "Always" },
  { value = "never", label = "Never" },
]

[[setting]]
id = "wrap"
label = "Long lines"
help = "What happens to lines wider than the terminal."
type = "choice"
default = "auto"
arg = "--wrap={value}"
group = "Behavior"
choices = [
  { value = "auto", label = "Wrap" },
  { value = "character", label = "Wrap anywhere", help = "Break lines at any character, not only between words." },
  { value = "never", label = "Cut off" },
]

[[setting]]
id = "tabs"
label = "Tab width"
help = "How many spaces a tab character takes. 0 passes tabs through unchanged."
type = "integer"
default = 4
min = 0
max = 16
arg = "--tabs={value}"
unit = "spaces"
group = "Behavior"
advanced = true

[[setting]]
id = "replace_cat"
label = "Use bat for cat"
help = "`cat` runs bat (without the pager). Piped into another command it still prints the plain file."
type = "bool"
default = false
group = "Commands"

[[setting]]
id = "man_pages"
label = "Colorful man pages"
help = "Show `man` pages through bat, with highlighting. Uses `col` from util-linux."
type = "bool"
default = false
group = "Commands"

# --- How the settings reach bat ----------------------------------------------

[[file]]
name = "config"
env = "BAT_CONFIG_PATH"
lines = ["# bat's config, generated by goatty from the bat plugin's settings.", "{args}"]

[[alias]]
name = "cat"
command = "bat"
args = ["--paging=never"]
when = "replace_cat"
description = "cat shows files with bat's highlighting"

[[env]]
name = "MANPAGER"
value = "sh -c 'col -bx | bat --language=man --plain'"
when = "man_pages"

[[env]]
name = "MANROFFOPT"
value = "-c"
when = "man_pages"

[permissions]
binaries = "bat is a program: goatty downloads its official release from GitHub (sharkdp/bat) and checks it against the pinned checksum."
