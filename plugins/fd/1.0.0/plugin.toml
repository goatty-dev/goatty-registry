schema = 1
id = "fd"
name = "fd"
version = "1.0.0"
summary = "Fast, friendly file and directory search"
description = """
fd finds files by name below the current directory. It is fast, respects ignore files, and has helpful defaults; `fd readme` finds README files while `fd -e toml` finds TOML files. It runs alongside `find`.
"""
publisher = "goatty"
homepage = "https://github.com/sharkdp/fd"
license = "MIT OR Apache-2.0"
keywords = ["find", "files", "search", "directories"]

[compat]
goatty = ">=0.0.1"
os = ["linux"]

[[package]]
id = "fd"
version = "10.5.0"
bin = ["fd"]

[[package.asset]]
target = "x86_64-linux"
url = "https://github.com/sharkdp/fd/releases/download/v10.5.0/fd-v10.5.0-x86_64-unknown-linux-musl.tar.gz"
sha256 = "761c72dc8e120d85b22292063be8a796e2eeb20eb3e4f38b8fa2343ccf3514a7"
size = 1573549
root = "fd-v10.5.0-x86_64-unknown-linux-musl"

[[package.asset]]
target = "aarch64-linux"
url = "https://github.com/sharkdp/fd/releases/download/v10.5.0/fd-v10.5.0-aarch64-unknown-linux-musl.tar.gz"
sha256 = "d76c4317f7d5dba69f8a2a15856c90c777e7f0dd4e85f0de8c76de6992c374d4"
size = 1429078
root = "fd-v10.5.0-aarch64-unknown-linux-musl"

# --- Settings (applied through the `fd` alias below) -------------------------

[[setting]]
id = "hidden"
label = "Include hidden files"
help = "Search files and folders whose names start with a dot. Applies when you type fd: it runs fd with the options you pick here."
type = "bool"
default = false
arg = "--hidden"

[[setting]]
id = "follow"
label = "Follow symbolic links"
help = "Also search folders reached through symbolic links."
type = "bool"
default = false
arg = "--follow"

[[alias]]
name = "fd"
command = "fd"
args = ["{args}"]
description = "fd runs with your settings"

[permissions]
binaries = "fd is a program: goatty downloads official sharkdp/fd releases and checks each archive against its pinned SHA-256 digest."
