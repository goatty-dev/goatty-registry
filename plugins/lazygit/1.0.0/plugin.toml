schema = 1
id = "lazygit"
name = "lazygit"
version = "1.0.0"
summary = "Terminal interface for everyday Git work"
description = """
lazygit gives Git a keyboard-driven terminal interface for staging changes, reviewing diffs, managing branches, and creating commits. The normal git command remains available.
"""
publisher = "goatty"
homepage = "https://github.com/jesseduffield/lazygit"
license = "MIT"
keywords = ["git", "repository", "terminal-ui", "commit"]

[compat]
goatty = ">=0.0.1"
os = ["linux"]

[[package]]
id = "lazygit"
version = "0.66.2"
bin = ["lazygit"]

[[package.asset]]
target = "x86_64-linux"
url = "https://github.com/jesseduffield/lazygit/releases/download/v0.66.2/lazygit_0.66.2_linux_x86_64.tar.gz"
sha256 = "158efc9ddfa1241fab5fb3526bb442c8dc6c4b1904d73213b9e4e93e03c52034"
size = 7332397

[[package.asset]]
target = "aarch64-linux"
url = "https://github.com/jesseduffield/lazygit/releases/download/v0.66.2/lazygit_0.66.2_linux_arm64.tar.gz"
sha256 = "79a3161eeb642f0473e23db6341f7baabd4a5933e921a9c1167c5d5c765c41a4"
size = 6654577

[[alias]]
name = "lg"
command = "lazygit"
description = "Open lazygit"

[permissions]
binaries = "lazygit is a program: goatty downloads official jesseduffield/lazygit releases and checks each archive against its pinned SHA-256 digest."
